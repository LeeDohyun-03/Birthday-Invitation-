<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Jisoo 💛</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Gowun+Dodum&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfaf6;
        }

        .phone-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
        }

        /* 배경 이미지 레이어 (1페이지: 그림자 사진 / 2페이지: 브이 포즈 사진) */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 1;
        }
        #bg1 {
            background-image: url('photo3.jpg'); /* 그림자 사진 */
            opacity: 1;
        }
        #bg2 {
            background-image: url('photo4.jpg'); /* 브이 포즈 사진 */
            opacity: 0;
            transform: scale(1.05);
        }

        /* 배경 위 따뜻한 파스텔 그라데이션 오버레이 */
        .pastel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, rgba(255, 250, 240, 0.45) 0%, rgba(255, 228, 214, 0.55) 50%, rgba(253, 215, 222, 0.65) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 2;
        }

        /* 페이지 공통 레이아웃 */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        /* 첫 페이지 버튼 (첫 번째 이미지 타이포그래피 구도 + 모던 파스텔) */
        .hbd-button {
            background: rgba(255, 253, 250, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            border-radius: 36px;
            padding: 38px 34px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(90, 60, 50, 0.2);
            animation: pulseTouch 2s infinite ease-in-out;
            user-select: none;
        }

        .hbd-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 5px;
            color: #8c7365;
        }

        .hbd-mid {
            font-family: 'Dancing Script', cursive;
            font-size: 3.4rem;
            color: #e57c73;
            line-height: 1.1;
            margin: 4px 0 10px 0;
            text-shadow: 2px 3px 0px #fff5eb;
        }

        .hbd-bottom-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .whisker {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .whisker span {
            display: block;
            width: 10px;
            height: 2px;
            background-color: #f3a683;
            border-radius: 2px;
        }
        .whisker.left span:nth-child(1) { transform: rotate(20deg); }
        .whisker.left span:nth-child(3) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(1) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(3) { transform: rotate(20deg); }

        .hbd-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #594a42;
        }

        .double-line {
            width: 80%;
            height: 4px;
            margin: 0 auto 14px auto;
            border-top: 1.5px solid #f5cd79;
            border-bottom: 1.5px solid #f5cd79;
        }

        .tap-hint {
            font-size: 0.85rem;
            color: #a68b7c;
        }

        @keyframes pulseTouch {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        /* 2페이지 여백 미니 사진 스티커 (나머지 2장 활용) */
        .mini-sticker {
            position: absolute;
            width: 95px;
            height: 110px;
            background: #fff;
            padding: 5px 5px 14px 5px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .mini-sticker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }
        .sticker-top { top: 7%; left: 8%; transform: rotate(-7deg); }
        .sticker-bottom { bottom: 7%; right: 8%; transform: rotate(6deg); }

        /* 2페이지 초대장 카드 */
        .invitation-card {
            background: rgba(255, 253, 250, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 36px 24px 28px 24px;
            width: 92%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(60, 40, 35, 0.22);
            text-align: center;
        }

        .main-heading {
            font-size: 1.25rem;
            font-weight: bold;
            color: #4a3c31;
            margin-bottom: 28px;
            background: linear-gradient(transparent 60%, #fff2b2 40%);
            display: inline-block;
            padding: 0 6px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
            text-align: left;
            padding: 0 10px;
        }

        .info-row {
            font-size: 1.05rem;
            color: #594a42;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eedad1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-label {
            font-weight: bold;
            color: #d17b68;
            min-width: 52px;
        }

        .map-link {
            color: #4a3c31;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: #f3a683;
        }

        .phone-link {
            color: #594a42;
            text-decoration: none;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #9c887b;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- 배경 사진 레이어 -->
    <div id="bg1" class="bg-layer"></div>
    <div id="bg2" class="bg-layer"></div>
    <div class="pastel-overlay"></div>

    <!-- 1페이지: 그림자 사진 배경 + HAPPY BIRTHDAY JISOO 버튼 -->
    <div id="page1" class="page">
        <button class="hbd-button" onclick="openInvitation()">
            <div class="hbd-top">HAPPY</div>
            <div class="hbd-mid">Birthday</div>
            <div class="hbd-bottom-wrap">
                <div class="whisker left"><span></span><span></span><span></span></div>
                <div class="hbd-name">JISOO</div>
                <div class="whisker right"><span></span><span></span><span></span></div>
            </div>
            <div class="double-line"></div>
            <div class="tap-hint">터치해서 초대장 열기 </div>
        </button>
    </div>

    <!-- 2페이지: 브이 포즈 사진 배경 + 초대장 본문 -->
    <div id="page2" class="page hidden">
        <!-- 나머지 2장의 사진을 여백 스티커로 배치 -->
        <div class="mini-sticker sticker-top"><img src="photo1.jpg" alt="셀카"></div>
        <div class="mini-sticker sticker-bottom"><img src="photo2.jpg" alt="와인잔"></div>

        <div class="invitation-card">
            <div class="main-heading">지수의 22번째 생일을 축하해💛</div>
            
            <div class="info-list">
                <div class="info-row">
                    <span class="info-label">시간 :</span>
                    <span>2026년 10월 18일 오후 6시</span>
                </div>
                <div class="info-row">
                    <span class="info-label">장소 :</span>
                    <a href="https://map.naver.com/p/search/%EB%8F%84%EC%9A%B0%EB%A3%B8%20%EC%84%9C%EB%9E%98%EB%A7%88%EC%9D%84" target="_blank" class="map-link">도우룸 서래마을 📍</a>
                </div>
                <div class="info-row">
                    <span class="info-label">연락처 :</span>
                    <a href="tel:010-2722-5260" class="phone-link">010-2722-5260</a>
                </div>
            </div>

            <div class="footer-text">내일 만나요!</div>
        </div>
    </div>
</div>

<script>
    function openInvitation() {
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
        document.getElementById('bg1').style.opacity = '0';
        document.getElementById('bg2').style.opacity = '1';
        document.getElementById('bg2').style.transform = 'scale(1)';
    }
</script>

</body>
</html>
