<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 카카오톡 링크 미리보기 설정 (제목 하트 제거 & photo2.jpg로 변경) -->
    <title>Happy Birthday Jisoo</title>
    <meta property="og:title" content="Happy Birthday Jisoo">
    <meta property="og:image" content="https://leedohyun-03.github.io/new-website/photo2.jpg?v=3">

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Gowun+Dodum&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfaf6;
        }

        .phone-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
        }

        /* 배경 이미지 레이어 (1페이지: 그림자 사진 / 2페이지: 브이 포즈 사진) */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 1;
        }
        #bg1 {
            background-image: url('photo3.jpg'); /* 그림자 사진 */
            opacity: 1;
        }
        #bg2 {
            background-image: url('photo4.jpg'); /* 브이 포즈 사진 */
            opacity: 0;
            transform: scale(1.05);
        }

        /* 배경 위 따뜻한 파스텔 그라데이션 오버레이 */
        .pastel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, rgba(255, 250, 240, 0.45) 0%, rgba(255, 228, 214, 0.55) 50%, rgba(253, 215, 222, 0.65) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 2;
        }

        /* 페이지 공통 레이아웃 */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        /* 첫 페이지 버튼 */
        .hbd-button {
            background: rgba(255, 253, 250, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            border-radius: 36px;
            padding: 38px 34px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(90, 60, 50, 0.2);
            animation: pulseTouch 2s infinite ease-in-out;
            user-select: none;
        }

        .hbd-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 5px;
            color: #8c7365;
        }

        .hbd-mid {
            font-family: 'Dancing Script', cursive;
            font-size: 3.4rem;
            color: #e57c73;
            line-height: 1.1;
            margin: 4px 0 10px 0;
            text-shadow: 2px 3px 0px #fff5eb;
        }

        .hbd-bottom-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .whisker {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .whisker span {
            display: block;
            width: 10px;
            height: 2px;
            background-color: #f3a683;
            border-radius: 2px;
        }
        .whisker.left span:nth-child(1) { transform: rotate(20deg); }
        .whisker.left span:nth-child(3) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(1) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(3) { transform: rotate(20deg); }

        .hbd-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #594a42;
        }

        .double-line {
            width: 80%;
            height: 4px;
            margin: 0 auto 14px auto;
            border-top: 1.5px solid #f5cd79;
            border-bottom: 1.5px solid #f5cd79;
        }

        .tap-hint {
            font-size: 0.85rem;
            color: #a68b7c;
        }

        @keyframes pulseTouch {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        /* 2페이지 여백 미니 사진 스티커 (총 3장 활용, 클릭 가능) */
        .mini-sticker {
            position: absolute;
            width: 92px;
            height: 108px;
            background: #fff;
            padding: 5px 5px 16px 5px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            z-index: 12;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .mini-sticker:active {
            transform: scale(0.93);
        }
        .mini-sticker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        /* 사진 아래 작은 'Click' 힌트 표시 */
        .mini-sticker::after {
            content: 'Click 🤍';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            color: #b89f91;
            letter-spacing: 0.5px;
        }

        /* 3장의 스티커 각각의 위치 */
        .sticker-tl { top: 5%; left: 7%; transform: rotate(-7deg); }
        .sticker-tr { top: 6%; right: 7%; transform: rotate(6deg); }
        .sticker-br { bottom: 5%; right: 8%; transform: rotate(5deg); }

        /* 2페이지 초대장 카드 */
        .invitation-card {
            background: rgba(255, 253, 250, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 36px 24px 28px 24px;
            width: 92%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(60, 40, 35, 0.22);
            text-align: center;
            z-index: 11;
        }

        .main-heading {
            font-size: 1.25rem;
            font-weight: bold;
            color: #4a3c31;
            margin-bottom: 28px;
            background: linear-gradient(transparent 60%, #fff2
