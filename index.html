<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 카카오톡 링크 미리보기 설정 (제목 하트 제거 & photo2.jpg로 변경) -->
    <title>Happy Birthday Jisoo</title>
    <meta property="og:title" content="Happy Birthday Jisoo">
    <meta property="og:image" content="https://leedohyun-03.github.io/new-website/photo2.jpg?v=3">

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Gowun+Dodum&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #fdfaf6;
        }

        .phone-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
        }

        /* 배경 이미지 레이어 (1페이지: 그림자 사진 / 2페이지: 브이 포즈 사진) */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 1;
        }
        #bg1 {
            background-image: url('photo3.jpg'); /* 그림자 사진 */
            opacity: 1;
        }
        #bg2 {
            background-image: url('photo4.jpg'); /* 브이 포즈 사진 */
            opacity: 0;
            transform: scale(1.05);
        }

        /* 배경 위 따뜻한 파스텔 그라데이션 오버레이 */
        .pastel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, rgba(255, 250, 240, 0.45) 0%, rgba(255, 228, 214, 0.55) 50%, rgba(253, 215, 222, 0.65) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 2;
        }

        /* 페이지 공통 레이아웃 */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        /* 첫 페이지 버튼 */
        .hbd-button {
            background: rgba(255, 253, 250, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            border-radius: 36px;
            padding: 38px 34px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(90, 60, 50, 0.2);
            animation: pulseTouch 2s infinite ease-in-out;
            user-select: none;
        }

        .hbd-top {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 5px;
            color: #8c7365;
        }

        .hbd-mid {
            font-family: 'Dancing Script', cursive;
            font-size: 3.4rem;
            color: #e57c73;
            line-height: 1.1;
            margin: 4px 0 10px 0;
            text-shadow: 2px 3px 0px #fff5eb;
        }

        .hbd-bottom-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .whisker {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .whisker span {
            display: block;
            width: 10px;
            height: 2px;
            background-color: #f3a683;
            border-radius: 2px;
        }
        .whisker.left span:nth-child(1) { transform: rotate(20deg); }
        .whisker.left span:nth-child(3) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(1) { transform: rotate(-20deg); }
        .whisker.right span:nth-child(3) { transform: rotate(20deg); }

        .hbd-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #594a42;
        }

        .double-line {
            width: 80%;
            height: 4px;
            margin: 0 auto 14px auto;
            border-top: 1.5px solid #f5cd79;
            border-bottom: 1.5px solid #f5cd79;
        }

        .tap-hint {
            font-size: 0.85rem;
            color: #a68b7c;
        }

        @keyframes pulseTouch {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        /* 2페이지 여백 미니 사진 스티커 (총 3장 활용, 클릭 가능) */
        .mini-sticker {
            position: absolute;
            width: 92px;
            height: 108px;
            background: #fff;
            padding: 5px 5px 16px 5px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            z-index: 12;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .mini-sticker:active {
            transform: scale(0.93);
        }
        .mini-sticker img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }
        /* 사진 아래 작은 'Click' 힌트 표시 */
        .mini-sticker::after {
            content: 'Click 🤍';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            color: #b89f91;
            letter-spacing: 0.5px;
        }

        /* 3장의 스티커 각각의 위치 */
        .sticker-tl { top: 5%; left: 7%; transform: rotate(-7deg); }
        .sticker-tr { top: 6%; right: 7%; transform: rotate(6deg); }
        .sticker-br { bottom: 5%; right: 8%; transform: rotate(5deg); }

        /* 2페이지 초대장 카드 */
        .invitation-card {
            background: rgba(255, 253, 250, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid #ffffff;
            border-radius: 28px;
            padding: 36px 24px 28px 24px;
            width: 92%;
            max-width: 350px;
            box-shadow: 0 15px 35px rgba(60, 40, 35, 0.22);
            text-align: center;
            z-index: 11;
        }

        .main-heading {
            font-size: 1.25rem;
            font-weight: bold;
            color: #4a3c31;
            margin-bottom: 28px;
            background: linear-gradient(transparent 60%, #fff2b2 40%);
            display: inline-block;
            padding: 0 6px;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
            text-align: left;
            padding: 0 10px;
        }

        .info-row {
            font-size: 1.05rem;
            color: #594a42;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eedad1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-label {
            font-weight: bold;
            color: #d17b68;
            min-width: 52px;
        }

        .map-link {
            color: #4a3c31;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 4px;
            text-decoration-color: #f3a683;
        }

        .phone-link {
            color: #594a42;
            text-decoration: none;
        }

        .footer-text {
            font-size: 0.85rem;
            color: #9c887b;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* ✨ 사진 클릭 시 확대되는 모달 팝업 & 텍스트 칸 디자인 (기존 카드와 통일) */
        .photo-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(50, 38, 33, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .photo-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(255, 253, 250, 0.96);
            border: 2px solid #ffffff;
            border-radius: 26px;
            padding: 18px 18px 22px 18px;
            width: 92%;
            max-width: 340px;
            box-shadow: 0 20px 45px rgba(40, 25, 20, 0.35);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.35s ease;
        }

        .photo-modal.active .modal-card {
            transform: scale(1);
        }

        .modal-img-wrap {
            width: 100%;
            max-height: 52dvh;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(180, 140, 120, 0.18);
            background: #fff;
        }

        .modal-img-wrap img {
            width: 100%;
            height: 100%;
            max-height: 52dvh;
            object-fit: cover;
            display: block;
        }

        /* 사진 밑에 들어가는 감성 텍스트 칸 */
        .modal-text-box {
            background: #fff9f2;
            border: 1.5px dashed #ebd5c8;
            border-radius: 16px;
            padding: 16px 14px;
            color: #4a3c31;
            font-size: 0.98rem;
            line-height: 1.6;
            word-break: keep-all;
            margin-bottom: 16px;
        }

        .modal-close-btn {
            background: #f3a683;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 9px 26px;
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(243, 166, 131, 0.35);
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- 배경 사진 레이어 -->
    <div id="bg1" class="bg-layer"></div>
    <div id="bg2" class="bg-layer"></div>
    <div class="pastel-overlay"></div>

    <!-- 1페이지: 그림자 사진 배경 + HAPPY BIRTHDAY JISOO 버튼 -->
    <div id="page1" class="page">
        <button class="hbd-button" onclick="openInvitation()">
            <div class="hbd-top">HAPPY</div>
            <div class="hbd-mid">Birthday</div>
            <div class="hbd-bottom-wrap">
                <div class="whisker left"><span></span><span></span><span></span></div>
                <div class="hbd-name">JISOO</div>
                <div class="whisker right"><span></span><span></span><span></span></div>
            </div>
            <div class="double-line"></div>
            <div class="tap-hint">터치해서 초대장 열기 </div>
        </button>
    </div>

    <!-- 2페이지: 브이 포즈 사진 배경 + 초대장 본문 -->
    <div id="page2" class="page hidden">
        <!-- 3장의 미니 사진 스티커 (클릭하면 확대됨) -->
        <div class="mini-sticker sticker-tl" onclick="openPhotoModal('photo1')">
            <img src="photo1.jpg" alt="셀카">
        </div>
        <div class="mini-sticker sticker-tr" onclick="openPhotoModal('photo5')">
            <img src="photo5.jpg" alt="인생네컷">
        </div>
        <div class="mini-sticker sticker-br" onclick="openPhotoModal('photo2')">
            <img src="photo2.jpg" alt="와인잔">
        </div>

        <div class="invitation-card">
            <div class="main-heading">지수의 22번째 생일을 축하해💛</div>
            
            <div class="info-list">
                <div class="info-row">
                    <span class="info-label">시간 :</span>
                    <span>2026년 10월 18일 오후 6시</span>
                </div>
                <div class="info-row">
                    <span class="info-label">장소 :</span>
                    <a href="https://map.naver.com/p/search/%EB%8F%84%EC%9A%B0%EB%A3%B8%20%EC%84%9C%EB%9E%98%EB%A7%88%EC%9D%84" target="_blank" class="map-link">도우룸 서래마을 📍</a>
                </div>
                <div class="info-row">
                    <span class="info-label">연락처 :</span>
                    <a href="tel:010-2722-5260" class="phone-link">010-2722-5260</a>
                </div>
            </div>

            <div class="footer-text">내일 만나요!</div>
        </div>
    </div>

    <!-- 사진 클릭 시 나타나는 확대 모달 창 -->
    <div id="photoModal" class="photo-modal" onclick="closePhotoModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-img-wrap">
                <img id="modalImg" src="" alt="확대된 사진">
            </div>
            <!-- 텍스트가 들어가는 칸 -->
            <div id="modalText" class="modal-text-box"></div>
            <button class="modal-close-btn" onclick="closePhotoModal()">닫기 🤍</button>
        </div>
    </div>
</div>

<script>
    function openInvitation() {
        document.getElementById('page1').classList.add('hidden');
        document.getElementById('page2').classList.remove('hidden');
        document.getElementById('bg1').style.opacity = '0';
        document.getElementById('bg2').style.opacity = '1';
        document.getElementById('bg2').style.transform = 'scale(1)';
    }

    // =========================================================================
    // 👇 [텍스트 수정하는 곳] 각 사진을 눌렀을 때 사진 밑에 나올 문구를 자유롭게 적어주세요!
    // (줄바꿈이 필요하면 문장 사이에 <br> 을 적어주시면 됩니다.)
    // =========================================================================
    const photoDescriptions = {
        photo1: "교대 축제 & 카사이~",
        photo2: "공주 너무 재밋었어! <br> 천국보다낯선도 너무 좋았고, 다음에 또 가요 ",
        photo5: "2026년 8월 19일 뽈뽀 먹고 찍은 첫 네컷사진인데 행궁동에서 찍은 거 받아야겟어."

    const photoFiles = {
        photo1: "photo1.jpg",
        photo2: "photo2.jpg",
        photo5: "photo5.jpg"
    };

    function openPhotoModal(key) {
        document.getElementById('modalImg').src = photoFiles[key];
        document.getElementById('modalText').innerHTML = photoDescriptions[key];
        document.getElementById('photoModal').classList.add('active');
    }

    function closePhotoModal() {
        document.getElementById('photoModal').classList.remove('active');
    }
</script>

</body>
</html>
